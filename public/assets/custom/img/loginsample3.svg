<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="theme3-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#10b981"/>
      <stop offset="100%" stopColor="#059669"/>
    </linearGradient>
    <linearGradient id="theme3-curve" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ffd700" stopOpacity="1"/>
      <stop offset="100%" stopColor="#ffd700" stopOpacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#f3f4f6"/>

  <!-- Header with gradient -->
  <rect width="800" height="120" fill="url(#theme3-grad)"/>

  <!-- Decorative curve -->
  <path d="M 0 100 Q 400 200 800 100 L 800 600 L 0 600 Z" fill="url(#theme3-curve)" opacity="0.5"/>

  <!-- Logo circle with yellow accent -->
  <circle cx="50" cy="60" r="30" fill="#ffd700" opacity="0.9"/>

  <!-- Title -->
  <text x="100" y="75" fontFamily="Arial, sans-serif" fontSize="32" fill="#ffffff" fontWeight="bold">Theme 3</text>

  <!-- Content placeholders -->
  <rect x="40" y="160" width="720" height="40" fill="#e5e7eb" rx="8"/>
  <rect x="40" y="220" width="720" height="30" fill="#e5e7eb" rx="8" opacity="0.7"/>
  <rect x="40" y="270" width="600" height="30" fill="#e5e7eb" rx="8" opacity="0.7"/>
  <rect x="40" y="330" width="720" height="40" fill="#e5e7eb" rx="8" opacity="0.5"/>
  <rect x="40" y="390" width="720" height="30" fill="#e5e7eb" rx="8" opacity="0.5"/>
</svg>